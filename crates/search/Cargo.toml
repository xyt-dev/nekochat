[package]
name = "nekochat-search"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Independent authenticated search service for DeepSeek and ChatGPT native web search"

[lib]
name = "nekochat_search"
path = "src/lib.rs"

[[bin]]
name = "nekochat-search"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
scraper = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="复平面单位圆：向量 e 的 iθ 次方，实部为 cos θ，虚部为 sin θ">
  <title>e^{iθ} 的实部与虚部</title>
  <desc>单位圆上角度为 θ 的点，横坐标是 cos θ，纵坐标是 sin θ。</desc>
  <defs>
    <linearGradient id="vec" x1="170" y1="160" x2="254" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--nk-accent)" stop-opacity="0.4"/>
      <stop offset="1" stop-color="var(--nk-accent)"/>
    </linearGradient>
  </defs>
  <g stroke="var(--nk-border)" stroke-width="1.4">
    <line x1="28" y1="160" x2="338" y2="160"/>
    <line x1="170" y1="296" x2="170" y2="24"/>
  </g>
  <text x="330" y="178" font-size="12" fill="var(--nk-muted)">Re</text>
  <text x="178" y="32" font-size="12" fill="var(--nk-muted)">Im</text>
  <circle cx="170" cy="160" r="110" fill="none" stroke="var(--nk-accent)" stroke-opacity="0.35" stroke-width="1.4"/>
  <line x1="254.3" y1="89.3" x2="254.3" y2="160" stroke="var(--nk-text)" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  <line x1="254.3" y1="89.3" x2="170" y2="89.3" stroke="var(--nk-text)" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  <line x1="170" y1="160" x2="254.3" y2="89.3" stroke="url(#vec)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="254.3" cy="89.3" r="4.5" fill="var(--nk-accent)"/>
  <path d="M 212 160 A 42 42 0 0 0 202.2 133" fill="none" stroke="var(--nk-text)" stroke-opacity="0.55"/>
  <text x="218" y="150" font-size="12" fill="var(--nk-muted)">θ</text>
  <line x1="170" y1="160" x2="254.3" y2="160" stroke="var(--nk-accent)" stroke-width="3.5" stroke-opacity="0.5"/>
  <line x1="170" y1="160" x2="170" y2="89.3" stroke="var(--nk-accent)" stroke-width="3.5" stroke-opacity="0.5"/>
  <text x="230" y="182" font-size="12" fill="var(--nk-text)">cos θ</text>
  <text x="104" y="128" font-size="12" fill="var(--nk-text)">sin θ</text>
  <text x="262" y="76" font-size="13" fill="var(--nk-text)">e<tspan font-size="10" dy="-6">iθ</tspan></text>
  <text x="282" y="155" font-size="11" fill="var(--nk-muted)">1</text>
  <text x="40" y="180" font-size="11" fill="var(--nk-muted)">0</text>
</svg>
